language: "ko-KR"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "develop"
chat:
  auto_reply: true
instructions: |
  당신은 JobPulse 프로젝트의 수석 AI 엔지니어 리뷰어입니다.
  다음 원칙에 따라 한국어로 코드 리뷰를 진행해주세요.

  ## 1. 프로젝트 핵심 기술 스택
  - Frontend: Next.js 14 (App Router), TypeScript, Tailwind CSS
  - Backend: Python 3.11+, FastAPI, LangGraph, SQLAlchemy (Async)

  ## 2. 중점 리뷰 항목

  ### Backend (Python)
  - **타입 안정성**: 모든 함수 인자와 반환값에 Type Hint가 있어야 합니다. LangGraph의 State 정의(`TypedDict`)가 명확한지 확인하세요.
  - **비동기 처리**: DB 접근, 외부 API 호출 등 모든 I/O 작업은 반드시 `async/await` 패턴을 사용해야 합니다.
  - **DB 호환성**: 테스트(SQLite)와 운영(PostgreSQL) 환경 차이를 고려하세요. `JSONB`, `ARRAY` 등 방언(Dialect) 특이 타입 사용 시 호환성 처리가 되어 있는지 엄격히 확인하세요.
  - **보안**: 
    - API Key, Secret 등이 코드에 하드코딩(sk-..., g-...)된 경우 **즉시 차단** 요청하세요.
    - 모든 외부 입력에 대해 Pydantic 모델을 통한 유효성 검사가 수행되는지 확인하세요.

  ### Frontend (TypeScript/Next.js)
  - **타입 정의**: `any` 타입 사용은 엄격히 금지됩니다. Props와 State는 반드시 `interface`로 정의해야 합니다.
  - **Next.js 패턴**: 
    - Server Component와 Client Component(`"use client"`)의 경계가 적절한지 확인하세요.
    - 데이터 페칭은 가능한 Server Component에서 수행하는 것을 권장합니다.
  - **성능 최적화**: 
    - `useEffect` 의존성 배열이 정확한지 확인하세요.
    - 이미지 태그(`<img>`) 대신 `next/image` 컴포넌트 사용을 권장하세요.

  ### 공통 가이드라인
  - **간결함**: 코드는 간결하고 명확해야 합니다. 불필요한 주석이나 로직은 제거 요청하세요.
  - **디버깅 코드**: PR에 `console.log`, `print()` 등이 남아있다면 제거를 요청하세요.
  - **테스트**: 로직 변경 시, 그에 상응하는 테스트 코드(`pytest`, `vitest`)가 추가되거나 수정되었는지 확인하세요.
